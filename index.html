<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Unlock</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <img src="logo.svg" alt="Logo Image">
    <form class="form-container" id="shieldForm">
      <label for="loopeyline">Shield id</label>
      <input type="text" id="loopeyline" name="loopeyline" autocomplete="off" required>
      <button type="submit">Submit</button>
    </form>
  </div>

  <script>
    document.getElementById("shieldForm").addEventListener("submit", function(event) {
      event.preventDefault();

      // Clean input: remove invisible non-printable characters, trim spaces, convert to uppercase
      let rawInput = document.getElementById("loopeyline").value;
      let cleanInput = rawInput
        .replace(/[\u200B-\u200D\uFEFF]/g, "") // strip zero-width/invisible chars
        .trim()
        .toUpperCase();

      // Allowed valid codes (in uppercase)
      const validCodes = [
        "3876J%@0",     // Standard percent sign
        "3876J\u2105@0", // Care-of symbol ℅
        "2854983"        // Numeric code
      ];

      if (validCodes.includes(cleanInput)) {
        window.location.href = "./main";
      } else {
        // Detailed error to help you identify what the browser actually sees
        alert(
          "Incorrect code!\n\n" +
          "What you typed: \"" + rawInput + "\"\n" +
          "Cleaned value: \"" + cleanInput + "\"\n" +
          "Character count: " + cleanInput.length
        );
      }
    });
  </script>
</body>
</html>
